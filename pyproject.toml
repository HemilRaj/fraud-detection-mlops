[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fraud-detection-mlops"
version = "0.1.0"
description = "Production-grade Real-Time Fraud Detection & MLOps Pipeline"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Hemil Makwana", email = "hemilmakwana1@gmail.com" }
]
dependencies = [
    # Core Data & ML
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "lightgbm>=4.0.0",
    "joblib>=1.3.0",

    # Schemas & Config
    "pydantic>=2.5.0",
    "pyyaml>=6.0.0",

    # API & Serving
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "httpx>=0.26.0",

    # Tracking & Monitoring
    "mlflow>=2.10.0",
    "evidently>=0.4.15",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",

    # Linting & Formatting
    "ruff>=0.2.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

# ----------------------------------------------------------------------
# Tool Configurations
# ----------------------------------------------------------------------

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = ["E501"] # line too long handled by formatter

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --cov=src"
testpaths = ["tests"]
pythonpath = ["."]